<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech-EDU | Plataforma de Cursos</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 20px; }
        #alerta-sistema { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 9999; 
            min-width: 300px; 
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">DevTech-EDU</a>
        </div>
    </nav>

    <div class="container">
        <div id="alerta-sistema" class="alert d-none" role="alert"></div>

        <ul class="nav nav-tabs mb-4" id="abaPrincipal" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-pane" type="button">Administração</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="aluno-tab" data-bs-toggle="tab" data-bs-target="#aluno-pane" type="button">Área do Aluno</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="financeiro-tab" data-bs-toggle="tab" data-bs-target="#financeiro-pane" type="button">Financeiro</button>
            </li>
        </ul>

        <div class="tab-content" id="conteudoAbas">
            
            <div class="tab-pane fade show active" id="admin-pane" role="tabpanel">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-header bg-primary text-white">Gerenciar Cursos</div>
                            <div class="card-body">
                                <form id="form-curso">
                                    <input type="hidden" id="input-curso-id" value="">
                                    <div class="mb-2">
                                        <label class="form-label">Título do Curso</label>
                                        <input type="text" id="input-titulo-curso" class="form-control">
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">Descrição</label>
                                        <textarea id="input-descricao-curso" class="form-control"></textarea>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">Categoria</label>
                                        <select id="select-categoria-curso" class="form-select">
                                            <option value="">Selecione...</option>
                                            </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Instrutor</label>
                                        <select id="select-instrutor-curso" class="form-select">
                                            <option value="">Selecione...</option>
                                        </select>
                                    </div>
                                    <button type="button" id="btn-salvar-curso" class="btn btn-success w-100" onclick="salvarCurso()">Salvar Curso</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header bg-secondary text-white">Cursos Cadastrados</div>
                            <div class="card-body">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Título</th>
                                            <th>Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabela-cursos-body">
                                        </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="aluno-pane" role="tabpanel">
                <div class="card">
                    <div class="card-header">Realizar Nova Matrícula</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-5">
                                <label>Aluno</label>
                                <select id="select-aluno-matricula" class="form-select"></select>
                            </div>
                            <div class="col-md-5">
                                <label>Curso</label>
                                <select id="select-curso-matricula" class="form-select"></select>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-primary w-100" onclick="realizarMatricula()">Matricular</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="financeiro-pane" role="tabpanel">
                <div class="card">
                    <div class="card-header bg-dark text-white">Registro Financeiro</div>
                    <div class="card-body">
                        <form id="form-pagamento">
                            <input type="hidden" id="input-pagamento-id">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label>Aluno</label>
                                    <select id="select-aluno-pagamento" class="form-select"></select>
                                </div>
                                <div class="col-md-4">
                                    <label>Plano</label>
                                    <select id="select-plano-pagamento" class="form-select"></select>
                                </div>
                                <div class="col-md-2">
                                    <label>Valor</label>
                                    <input type="number" step="0.01" id="input-valor-pagamento" class="form-control">
                                </div>
                                <div class="col-md-2">
                                    <label>Método</label>
                                    <select id="select-metodo-pagamento" class="form-select">
                                        <option value="Cartão">Cartão</option>
                                        <option value="PIX">PIX</option>
                                        <option value="Boleto">Boleto</option>
                                    </select>
                                </div>
                                <div class="col-12 mt-3">
                                    <button type="button" class="btn btn-primary" onclick="salvarPagamento()">Processar Pagamento</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div> </div> <script src="./js/bootstrap.bundle.min.js"></script>

    <script type="module" src="./main.mjs"></script>

</body>
</html>
